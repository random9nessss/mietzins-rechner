name: Update Referenzzinssatz

on:
  schedule:
    # 4th of Mar/Jun/Sep/Dec, 08:00 UTC — a few days after the BWO announcement
    # on the first working day of the month.
    - cron: "0 8 4 3,6,9,12 *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch BWO rate and patch data
        id: update
        run: |
          set +e
          python3 scripts/update_rate.py
          code=$?
          set -e
          if [ "$code" = "0" ];  then echo "changed=true"  >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = "78" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Nothing to do."; fi
          if [ "$code" != "0" ] && [ "$code" != "78" ]; then exit "$code"; fi

      - name: Run engine tests
        if: steps.update.outputs.changed == 'true'
        run: python3 test_mietrecht_engine.py

      - name: Rebuild site
        if: steps.update.outputs.changed == 'true'
        run: python3 scripts/build_site.py

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mietrecht_engine.py docs/
          git commit -m "bwo: automatic Referenzzinssatz data update"
          git push

      - name: Trigger Pages deployment
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      # Only on a genuine DECREASE: mail everyone who subscribed via the
      # info@zinscheck.ch mailbox (subject ABO; see scripts/notify_subscribers.py).
      # continue-on-error so a mail hiccup never re-flags the (successful) data
      # update as failed — it gets its own issue below instead.
      - name: Notify subscribers of the reduction
        id: notify
        if: steps.update.outputs.changed == 'true' && steps.update.outputs.rate_decreased == 'true'
        continue-on-error: true
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          INFOMANIAK_TOKEN: ${{ secrets.INFOMANIAK_TOKEN }}
        run: |
          python3 scripts/notify_subscribers.py --selftest
          python3 scripts/notify_subscribers.py --send

      - name: Open issue on notification failure
        if: steps.notify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Subscriber notification failed ($(date -u +%Y-%m-%d))" \
            --body "The rate data was updated and deployed successfully, but sending the rent-reduction notification emails failed (check MAIL_USER/MAIL_PASSWORD secrets and the workflow logs — no addresses are logged). Re-send manually within 14 days of the effective date with: MAIL_USER=... MAIL_PASSWORD=... python3 scripts/notify_subscribers.py --send"

      - name: Open issue on verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Referenzzinssatz auto-update failed ($(date -u +%Y-%m-%d))" \
            --body "The quarterly BWO updater could not verify or apply the new data. Nothing was committed. Check the workflow run logs, verify the rate manually at https://www.bwo.admin.ch/de/referenzzinssatz, and update the rate-data JSON in index.html plus REFERENCE_RATE_SERIES in mietrecht_engine.py by hand (then run scripts/build_site.py)."
